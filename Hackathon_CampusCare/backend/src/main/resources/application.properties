# ====================================================================
# CampusCare Enterprise Application Configuration
# ====================================================================
server.port=8080

# Database Connectivity via Environment Variables
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuscare_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
campuscare.jwt.secret=${JWT_SECRET:c2VjdXJlX2NhbXB1c2NhcmVfaW5zdGl0dXRpb25hbF9qd3Rfc2VjcmV0X2tleV8yMDI2X2FubW9k}
campuscare.jwt.expiration-ms=86400000

# Multipart Configuration for File Uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# AI Microservice URL (FastAPI)
ai.service.url=${AI_SERVICE_URL:http://127.0.0.1:8000}

